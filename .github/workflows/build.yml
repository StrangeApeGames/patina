name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            asset: patina-macos-arm64
          - os: windows-latest
            name: windows-x64
            asset: patina-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      # third_party/LightUSD (USD export) is a submodule; without it the build has no USD export and the tests fail
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -n 's/^project(patina VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != CMakeLists.txt version $v"; exit 1; }

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        shell: bash
        env:
          PY: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: bash tests/run_tests.sh build/patina

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: patina-${{ matrix.name }}
          path: |
            build/patina
            build/patina.exe
            tools/blender/patina_blender.py
            docs/AGENT_GUIDE.md
          if-no-files-found: ignore

      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          if [ -f build/patina.exe ]; then cp build/patina.exe "dist/${{ matrix.asset }}"; else cp build/patina "dist/${{ matrix.asset }}"; fi

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/${{ matrix.asset }}

  # Tag v<version> -> GitHub release with one binary per platform plus SHA256SUMS.txt (checked by `patina update`).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Patina $GITHUB_REF_NAME" --generate-notes
